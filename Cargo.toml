# Portage Rust de https://github.com/warith-harchaoui/vocal-helper (Python).
#
# Portée v0.1 : les chemins Nemotron gratuits et locaux, diarisation en flux
# (Nemotron 3) et transcription (Nemotron 3.5) — front-end log-mel, tenue du
# cache de locuteurs et de la file, calendrier et ses deux plafonds, décodage
# CTC ; enfin la liaison à ONNX Runtime derrière la feature `onnx`. Les chemins
# payants (Gladia, pyannoteAI) ne sont pas écrits ; le README le dit plutôt que
# de laisser croire.
#
# Ce portage ne vise PAS la vitesse ; c'est mesuré : 99,8 % du temps de la
# diarisation est déjà dans ONNX Runtime, donc en C++ ; `ort` appelle la même
# bibliothèque. Il vise les endroits où Python ne va pas — iOS, Android, un
# binaire unique par plateforme.
[package]
name = "vocal-helper-rs"
version = "0.1.0"
edition = "2021"
# Vérifié et non supposé : `cargo test` passe sur 1.82.0 (rustc lu dans
# target/.rustc_info.json) comme sur 1.95.0. Le plancher est fixé par
# `std::iter::repeat_n`, stable depuis 1.82.
rust-version = "1.82"
license = "BSD-3-Clause"
description = "Portage Rust de vocal-helper : diarisation de la parole en flux et transcription, sans Python, sur CPU, CUDA, TensorRT, CoreML ou DirectML."
repository = "https://github.com/warith-harchaoui/vocal-helper-rs"
homepage = "https://deraison.ai/ai-helpers/"
readme = "README.md"
keywords = ["diarization", "transcription", "speech", "onnx", "cuda"]
categories = ["multimedia::audio", "science"]
exclude = ["tests/fixtures/*"]

[dependencies]
realfft = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# La liaison à ONNX Runtime, optionnelle : tout le reste de la caisse se teste
# sans elle, sur une machine nue. Elle demande Rust 1.92 (le plancher d'`ort`
# rc.15) ; sans elle, `rust-version` ci-dessus reste le plancher.
#
# Épinglée exactement, parce que `ort` change d'API d'une rc à l'autre. Une contrainte
# `^2.0.0-rc.15` laisserait un projet neuf résoudre la rc suivante, que ce code
# n'a jamais vue. Une caisse publiée fige ses métadonnées : le plafond se pose
# avant, pas après.
ort = { version = "=2.0.0-rc.15", optional = true }

[features]
default = []
onnx = ["dep:ort"]
# Les moteurs d'exécution, un par feature, chacun impliquant `onnx`. Ils
# s'appuient sur les binaires préconstruits qu'`ort` télécharge (ONNX Runtime
# 1.31.0), qui n'existent que pour certaines cibles : une feature compilée hors
# de sa plateforme échoue au build d'`ort-sys`, pas à l'exécution. Le détail
# (CUDA 13, cuDNN 9, pilote) est dans le README, section « Ubuntu + NVIDIA ».
#
# Linux x86_64 / aarch64 et Windows x86_64, NVIDIA : CUDA 13 + cuDNN 9.
cuda = ["onnx", "ort/cuda"]
# TensorRT en plus de CUDA ; même binaire préconstruit que `cuda`.
tensorrt = ["cuda", "ort/tensorrt"]
# macOS et iOS.
coreml = ["onnx", "ort/coreml"]
# Windows, tout GPU DirectX 12.
directml = ["onnx", "ort/directml"]
# Intel, Linux x86_64 et Windows x86_64. Exclusive de `cuda` : aucun binaire
# préconstruit ne porte les deux.
openvino = ["onnx", "ort/openvino"]

[dev-dependencies]
serde_json = "1.0"
hound = "3.5"

[[example]]
name = "transcribe"
required-features = ["onnx"]

[[example]]
name = "diarize"
required-features = ["onnx"]
