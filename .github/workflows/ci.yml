name: CI

# Deliberately light: two Linux jobs, nothing else. The same four gates run in
# `.githooks/pre-push` before a push can leave the machine, so by the time this
# workflow starts everything in it has already passed once — CI is the
# confirmation, not the first run.
#
# Nothing here needs a model or a GPU. The crate's own ONNX Runtime binding sits
# behind a feature flag precisely so that the mel front end, the speaker cache,
# the streaming schedule, the segment builder and the provider policy can all be
# tested on a bare runner, including their parity against fixtures generated by
# the Python twin. That is the part a regression would hide in.
on:
  push:
  pull_request:

# A burst of pushes to the same branch should cost one run, not one per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat warnings as errors everywhere, not just in the clippy step.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # A hung job must not ride GitHub's 6-hour default: this one takes
    # well under two minutes, so anything near the ceiling is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Formatting is a fast, deterministic gate — run it first so a whitespace slip fails
      # in seconds rather than after a full build.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doc-tests)
        run: cargo test --all

      # The steps above all build against the committed Cargo.lock, which pins dependency
      # versions no downstream consumer ever sees: a range that has gone bad stays green
      # here while breaking every fresh `cargo add` / `cargo install`. (md2star-rs 0.4.0
      # shipped uninstallable for exactly this reason, with this matrix green.) A lock-free
      # resolve closes that blind spot.
      - name: Fresh resolve (no Cargo.lock — what a downstream consumer gets)
        run: ./scripts/check-fresh-resolve.sh

  # The `cuda` and `tensorrt` features on a runner with no GPU: ort downloads the
  # CUDA 13 build of ONNX Runtime, the crate must compile against it, and every
  # session must still open on the CPU with a warning. This proves the build and
  # the fallback on Ubuntu; it proves NOTHING about running on a GPU, which no
  # free GitHub runner has.
  cuda:
    name: cuda + tensorrt build, CPU fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VH_EXPECT_NO_GPU: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: cuda

      - name: Clippy with cuda + tensorrt (warnings are errors)
        run: cargo clippy --all-targets --features cuda,tensorrt -- -D warnings

      - name: Tests with cuda + tensorrt compiled in, no GPU (must fall back to CPU)
        run: cargo test --features cuda,tensorrt

      # What a deployed binary must ship next to itself, and which CUDA / cuDNN /
      # TensorRT sonames the provider libraries ask for: the README's
      # "Ubuntu + NVIDIA" section is written from this output.
      - name: Provider libraries and their NVIDIA dependencies
        run: |
          ls -l target/debug/ | grep -E 'libonnxruntime.*\.so'
          for lib in target/debug/libonnxruntime_providers_cuda.so target/debug/libonnxruntime_providers_tensorrt.so; do
            echo "== $lib"
            ldd "$lib" | grep -E 'cuda|cudnn|cublas|cufft|curand|nvrtc|nvinfer|nvonnx|not found' | sort -u
          done
